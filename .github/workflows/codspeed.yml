name: CodSpeed
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
jobs:
  benchmarks:
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis/redis-stack-server:latest
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{
          hashFiles('**/poetry.lock') }}
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root --with tests
    - name: Install project
      run: poetry install --no-interaction
    - name: Wait for Redis to be ready
      run: "echo \"Waiting for Redis to be ready...\"\nfor i in {1..30}; do\n  if\
        \ redis-cli -h localhost -p 6379 ping > /dev/null 2>&1; then\n    echo \"\
        Redis is ready!\"\n    exit 0\n  fi\n  echo \"Waiting for Redis... ($i/30)\"\
        \n  sleep 2\ndone\nexit 1\n"
    - name: Run benchmarks
      uses: CodSpeedHQ/action@v4.4.1
      with:
        upload-url: ${{ secrets.CODSPEED_STAGING_UPLOAD_URL }}
        mode: simulation
        run: poetry run pytest benchmarks/ --codspeed
