name: CodSpeed
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
  id-token: write
jobs:
  codspeed:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Start Redis
      run: 'cd tests/integration

        docker compose -f docker-compose.redis.yml up -d

        '
    - name: Wait for Redis to be ready
      run: "echo \"Waiting for Redis to be ready...\"\nfor i in {1..30}; do\n  if\
        \ docker exec $(docker ps -q --filter \"name=redis\") redis-cli ping > /dev/null\
        \ 2>&1; then\n    echo \"Redis is ready!\"\n    exit 0\n  fi\n  echo \"Waiting\
        \ for Redis... ($i/30)\"\n  sleep 2\ndone\nexit 1\n"
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{
          hashFiles('**/poetry.lock') }}
    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root --with tests
    - name: Install project
      run: poetry install --no-interaction --with tests
    - name: Run benchmarks
      uses: CodSpeedHQ/action@v4
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6370
        REDIS_DB: 0
      with:
        upload-url: ${{ secrets.CODSPEED_STAGING_UPLOAD_URL }}
        mode: simulation
        run: poetry run pytest tests/benchmarks/ --codspeed
    - name: Stop Redis
      if: always()
      run: 'cd tests/integration

        docker compose -f docker-compose.redis.yml down

        '
